<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подпишись</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .meme-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .meme-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        }

        .meme-image {
            width: 100%;
            height: auto;
            border-radius: 16px;
            display: block;
            background: rgba(255, 255, 255, 0.1);
            min-height: 300px;
            object-fit: cover;
        }

        .social-buttons {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .social-btn {
            flex: 1;
            min-width: 100px;
            max-width: 180px;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .social-btn:hover::before {
            left: 100%;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .social-btn:active {
            transform: translateY(-1px);
        }

        .btn-max {
            background: linear-gradient(135deg, #0077FF 0%, #0055CC 100%);
        }

        .btn-tg {
            background: linear-gradient(135deg, #0088cc 0%, #006699 100%);
        }

        .btn-vk {
            background: linear-gradient(135deg, #0077FF 0%, #0055DD 100%);
        }

        .social-icon {
            width: 24px;
            height: 24px;
            fill: white;
        }
        
        .main-text {
        font-family: 'Montserrat', 'Inter', sans-serif; /* Подключите шрифт с весом 800/900 */
        font-size: 32px;
        font-weight: 800; /* ExtraBold */
        line-height: 1.2;
        color: white;
        text-decoration: none;
        }

        @media (max-width: 480px) {
            .social-buttons {
                flex-direction: column;
            }
            
            .social-btn {
                max-width: 100%;
            }

            .meme-image {
                min-height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-text" >Подпишись!!!</div>

        <div class="meme-card">
            <img src="meme.jpg" alt="Мем" class="meme-image">
        </div>

        <div class="social-buttons">
            <a href="https://max.ru/id2538076836_gos3" class="social-btn btn-max" target="_blank">

                MAX

            <a href="https://t.me/kvantorium_vl" class="social-btn btn-tg" target="_blank">

        </div>
    </div>
</body>
</html>
